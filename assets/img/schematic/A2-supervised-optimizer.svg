<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="1800" height="820" font-family="Inter, Arial, Helvetica, sans-serif">
<rect width="900" height="410" fill="#ffffff"/>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586279"/></marker>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b2333"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b94a1b"/></marker>
</defs>
<rect x="40" y="62" width="190" height="72" rx="8" fill="#e2ebfa" stroke="#2468c9" stroke-width="1.7"/>
<text x="135.0" y="92" font-size="16" font-weight="700" fill="#1b2333" text-anchor="middle">Optimizer</text>
<text x="135.0" y="113" font-size="13.5" font-weight="400" fill="#586279" text-anchor="middle">makes every step</text>
<rect x="300" y="62" width="190" height="72" rx="8" fill="#ffffff" stroke="#586279" stroke-width="1.7"/>
<text x="395.0" y="92" font-size="16" font-weight="700" fill="#1b2333" text-anchor="middle">Monitor</text>
<text x="395.0" y="113" font-size="13.5" font-weight="400" fill="#586279" text-anchor="middle">checks every step</text>
<path d="M655 54L760 98L655 142L550 98Z" fill="#ffffff" stroke="#586279" stroke-width="1.7"/>
<text x="655" y="94" font-size="14.5" font-weight="700" fill="#1b2333" text-anchor="middle">Progress</text>
<text x="655" y="111" font-size="14.5" font-weight="700" fill="#1b2333" text-anchor="middle">stalled?</text>
<path d="M230 98H294" stroke="#1b2333" stroke-width="1.9" fill="none" marker-end="url(#ai)"/>
<path d="M490 98H544" stroke="#1b2333" stroke-width="1.9" fill="none" marker-end="url(#ai)"/>
<path d="M655 54V26H135V58" stroke="#1b2333" stroke-width="1.9" fill="none" marker-end="url(#ai)"/>
<text x="395" y="19" font-size="13.5" font-weight="400" fill="#586279" text-anchor="middle">no: carry on (most steps)</text>
<path d="M760 98H800V236H724" stroke="#1b2333" stroke-width="1.9" fill="none" marker-end="url(#ai)"/>
<text x="810" y="170" font-size="13.5" font-weight="400" fill="#586279" text-anchor="start">yes</text>
<rect x="530" y="200" width="190" height="72" rx="8" fill="#fae7dc" stroke="#b94a1b" stroke-width="1.7"/>
<text x="625.0" y="230" font-size="16" font-weight="700" fill="#1b2333" text-anchor="middle">AI agent</text>
<text x="625.0" y="251" font-size="13.5" font-weight="400" fill="#586279" text-anchor="middle">suggests one setting change</text>
<rect x="285" y="200" width="190" height="72" rx="8" fill="#dcf0e4" stroke="#18733f" stroke-width="1.7"/>
<text x="380.0" y="230" font-size="16" font-weight="700" fill="#1b2333" text-anchor="middle">Validator</text>
<text x="380.0" y="251" font-size="13.5" font-weight="400" fill="#586279" text-anchor="middle">inside the allowed limits?</text>
<path d="M340 227l5 5 9-11" stroke="#18733f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-26 0)"/>
<rect x="40" y="200" width="190" height="72" rx="8" fill="#f6ebd2" stroke="#586279" stroke-width="1.7"/>
<text x="135.0" y="230" font-size="16" font-weight="700" fill="#1b2333" text-anchor="middle">Trial</text>
<text x="135.0" y="251" font-size="13.5" font-weight="400" fill="#586279" text-anchor="middle">five steps from a checkpoint</text>
<path d="M530 236H481" stroke="#1b2333" stroke-width="1.9" fill="none" marker-end="url(#ai)"/>
<path d="M285 236H236" stroke="#1b2333" stroke-width="1.9" fill="none" marker-end="url(#ai)"/>
<path d="M135 200V140" stroke="#1b2333" stroke-width="1.9" fill="none" marker-end="url(#ai)"/>
<text x="148" y="164" font-size="13.5" font-weight="700" fill="#2468c9" text-anchor="start">better: keep the change</text>
<text x="148" y="182" font-size="13.5" font-weight="700" fill="#b94a1b" text-anchor="start">worse: roll back</text>
<path d="M135 272V318M380 272V318M625 272V318" stroke="#586279" stroke-width="1.3" stroke-dasharray="3 4" fill="none"/>
<rect x="40" y="318" width="680" height="40" rx="6" fill="#ffffff" stroke="#586279" stroke-width="1.3"/>
<text x="380" y="343" font-size="14" text-anchor="middle" fill="#1b2333"><tspan font-weight="700">Logbook</tspan><tspan fill="#586279">   every request, answer and decision is saved</tspan></text>
<text x="380" y="392" font-size="14.5" font-weight="700" fill="#1b2333" text-anchor="middle">The agent changes settings only. Only the optimizer moves the atoms.</text>
</svg>