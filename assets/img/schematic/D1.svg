<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1b2333"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#586279"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b94a1b"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18733f"/></marker></defs><rect width="1600" height="960" fill="#fff"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1b2333" text-anchor="start">Module 1 in detail: xTB basin search and agent-supervised L-BFGS</text>
<text x="40" y="82" font-size="18" font-weight="400" fill="#586279" text-anchor="start">Only L-BFGS on Skala-1.1 moves the atoms; code does the monitoring; the language model proposes settings</text>
<rect x="40" y="120" width="230" height="110" rx="12" fill="#f3f4f7" stroke="#999" stroke-width="2.2"/>
<text x="155.0" y="168.3" font-size="19" font-weight="700" fill="#1b2333" text-anchor="middle">Start structure</text>
<text x="155.0" y="201.60000000000002" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">e.g. distorted C₁₁H₈</text>
<path d="M272 175H316" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<rect x="320" y="120" width="300" height="110" rx="12" fill="#e2ebfa" stroke="#2468c9" stroke-width="2.2"/>
<text x="470.0" y="157.95000000000002" font-size="19" font-weight="700" fill="#1b2333" text-anchor="middle">xTB basin search</text>
<text x="470.0" y="191.25000000000003" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">GFN2-xTB, 13 seeds</text>
<text x="470.0" y="211.95000000000002" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">run by plain code</text>
<path d="M622 175H666" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<rect x="670" y="120" width="320" height="110" rx="12" fill="#fae7dc" stroke="#b94a1b" stroke-width="2.2"/>
<text x="830.0" y="157.95000000000002" font-size="19" font-weight="700" fill="#1b2333" text-anchor="middle">Pick starting basin</text>
<text x="830.0" y="191.25000000000003" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">language model reads the</text>
<text x="830.0" y="211.95000000000002" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">table of basins</text>
<path d="M830 232V290" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<rect x="40" y="290" width="1520" height="420" rx="18" fill="#e6f3d3" stroke="#5e9b1f" stroke-width="3"/>
<text x="64" y="328" font-size="21" font-weight="700" fill="#5e9b1f" text-anchor="start">Supervised optimization</text>
<text x="64" y="350" font-size="15" font-weight="400" fill="#586279" text-anchor="start">schedule of passes: step cap, force target, SCF tolerance, step budget (settings can change between any two steps)</text>
<rect x="70" y="400" width="290" height="130" rx="12" fill="#cfe9a8" stroke="#5e9b1f" stroke-width="4"/>
<text x="215.0" y="437.95" font-size="20" font-weight="700" fill="#1b2333" text-anchor="middle">L-BFGS step</text>
<text x="215.0" y="472.45" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">ASE L-BFGS on a GPU4PySCF</text>
<text x="215.0" y="493.15" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">Skala-1.1 calculator</text>
<text x="215.0" y="513.8499999999999" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">moves the atoms</text>
<path d="M362 465H416" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<rect x="420" y="400" width="280" height="130" rx="12" fill="#e2ebfa" stroke="#2468c9" stroke-width="2.2"/>
<text x="560.0" y="437.95" font-size="20" font-weight="700" fill="#1b2333" text-anchor="middle">Monitor</text>
<text x="560.0" y="472.45" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">five-step window,</text>
<text x="560.0" y="493.15" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">six stall triggers</text>
<text x="560.0" y="513.8499999999999" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">(uphill, oscillation, plateau …)</text>
<path d="M702 465H766" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<path d="M870 405L970 465L870 525L770 465Z" fill="#ffffff" stroke="#586279" stroke-width="2.4"/>
<text x="870" y="460" font-size="15" font-weight="700" fill="#1b2333" text-anchor="middle">Trigger or</text>
<text x="870" y="480" font-size="15" font-weight="700" fill="#1b2333" text-anchor="middle">pass end?</text>
<path d="M870 405V380H215V396" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<text x="540" y="376" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">no: next step (most steps never reach the model)</text>
<path d="M972 465H1036" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<text x="1004" y="452" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">yes</text>
<rect x="1040" y="400" width="230" height="130" rx="12" fill="#fae7dc" stroke="#b94a1b" stroke-width="3"/>
<text x="1155.0" y="448.3" font-size="20" font-weight="700" fill="#1b2333" text-anchor="middle">Agent + guard</text>
<text x="1155.0" y="482.8" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">one checked action</text>
<text x="1155.0" y="503.5" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">(zoom: next figure)</text>
<path d="M1272 465H1316" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<rect x="1320" y="400" width="210" height="130" rx="12" fill="#f3f4f7" stroke="#586279" stroke-width="2.2"/>
<text x="1425.0" y="447.95" font-size="19" font-weight="700" fill="#1b2333" text-anchor="middle">Setting change</text>
<text x="1425.0" y="481.25" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">step cap, memory,</text>
<text x="1425.0" y="501.95" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">force target …</text>
<path d="M1425 532V600H215V534" stroke="#18733f" stroke-width="2.6" fill="none" marker-end="url(#g)" stroke-linejoin="round"/>
<text x="820" y="592" font-size="15" font-weight="400" fill="#18733f" text-anchor="middle">changed settings go straight back into the running optimizer, no restart</text>
<text x="70" y="670" font-size="15" font-weight="700" fill="#1b2333" text-anchor="start">Every packet, call and response is written to a log.</text>
<path d="M830 712V770" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<rect x="660" y="774" width="320" height="100" rx="12" fill="#fae7dc" stroke="#b94a1b" stroke-width="2.2"/>
<text x="820.0" y="806.9499999999999" font-size="19" font-weight="700" fill="#1b2333" text-anchor="middle">Final check</text>
<text x="820.0" y="840.2499999999999" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">language model checks structure,</text>
<text x="820.0" y="860.9499999999999" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">bonds and planarity</text>
<path d="M982 824H1046" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<rect x="1050" y="774" width="310" height="100" rx="12" fill="#ffffff" stroke="#18733f" stroke-width="3"/>
<text x="1205.0" y="817.3" font-size="19" font-weight="700" fill="#1b2333" text-anchor="middle">Relaxed geometry</text>
<text x="1205.0" y="850.5999999999999" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">+ decision log</text>
<path d="M1362 824H1396" stroke="#1b2333" stroke-width="2.6" fill="none" marker-end="url(#a)" stroke-linejoin="round"/>
<rect x="1400" y="774" width="160" height="100" rx="12" fill="#e2ebfa" stroke="#2468c9" stroke-width="2.2"/>
<text x="1480.0" y="816.26" font-size="18" font-weight="700" fill="#1b2333" text-anchor="middle">To modules</text>
<text x="1480.0" y="848.66" font-size="16" font-weight="400" fill="#586279" text-anchor="middle">2 and 3</text>
<rect x="50" y="792" width="26" height="20" rx="4" fill="#e2ebfa" stroke="#2468c9" stroke-width="2"/>
<text x="86" y="808" font-size="15" font-weight="400" fill="#586279" text-anchor="start">plain code</text>
<rect x="50" y="822" width="26" height="20" rx="4" fill="#fae7dc" stroke="#b94a1b" stroke-width="2"/>
<text x="86" y="838" font-size="15" font-weight="400" fill="#586279" text-anchor="start">language model</text>
<rect x="50" y="852" width="26" height="20" rx="4" fill="#cfe9a8" stroke="#5e9b1f" stroke-width="2"/>
<text x="86" y="868" font-size="15" font-weight="400" fill="#586279" text-anchor="start">moves the atoms</text>
<text x="800.0" y="942" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">Controller is a setting: the same loop can run with the language-model agent or a rule-based control. Schematic, not computed data.</text></svg>