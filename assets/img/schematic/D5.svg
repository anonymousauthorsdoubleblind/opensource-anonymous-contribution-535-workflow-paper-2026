<text x="1397.0" y="267.95" font-size="19" font-weight="700" fill="#1b2333" text-anchor="middle">Compared with</text>
<text x="1397.0" y="301.25" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">Skala-1.1 relaxation</text>
<text x="1397.0" y="321.95" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">energy differences</text>
<rect x="40" y="420" width="1520" height="150" rx="14" fill="#fae7dc" stroke="#b94a1b" stroke-width="2.2"/>
<text x="70" y="460" font-size="19" font-weight="700" fill="#b94a1b" text-anchor="start">Scope note</text>
<text x="70" y="494" font-size="17" font-weight="400" fill="#1b2333" text-anchor="start">The charges and CCSD(T) differences were computed on the hand-set route's minima, not on output of the Hessian module.</text>
<text x="70" y="522" font-size="17" font-weight="400" fill="#1b2333" text-anchor="start">Hardware: one GPU (A100, L4 or T4) for the SCF steps; CPU for CCSD(T).</text>
<text x="40" y="640" font-size="17" font-weight="400" fill="#586279" text-anchor="start">Why this module is in the workflow: it shows that Skala-1.1 geometries feed ordinary electronic-structure analysis,</text>
<text x="40" y="666" font-size="17" font-weight="400" fill="#586279" text-anchor="start">and that the results sit beside established methods.</text>
<text x="800.0" y="722" font-size="15" font-weight="400" fill="#586279" text-anchor="middle">Schematic of the workflow, not computed data.</text></svg>